<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Block animation regression</title></head>
<body><div id="app"></div>
<script type="module">
import { createApp, h, ref } from 'vue';
import GameBoard from '/src/components/GameBoard.vue';
import LiveBoxScore from '/src/components/LiveBoxScore.vue';
import PlayByPlayPanel from '/src/components/PlayByPlayPanel.vue';
import { buildPlayByPlay } from '/src/utils/playByPlay.js';
import '/src/assets/main.css';
// Isolated recorded fixture: never changes a live game or calls its backend.
window.fetch = async () => new Response(JSON.stringify({ shot_probability: .8, shot_probability_final: .588, block_probability: .02 }), { headers: { 'Content-Type': 'application/json' } });
const initial = { enable_multi_possession:true, multi_possession_enabled:true, court_width: 7, court_height: 7, positions: [[1,3],[-1,4],[0,3],[2,2]], basket_position: [0,3], ball_holder:0, offense_ids:[0,1], defense_ids:[2,3], team_a_ids:[0,1], team_b_ids:[2,3], offense_team:'team_a', offense_label:'user', team_ownership:{team_a:'user',team_b:'ai'}, shot_clock:10, game_clock_remaining:124, episode_end_mode:'game_clock', game_phase:'live', team_a_score:0,team_b_score:0,user_score:0,ai_score:0, ball_handler_shot_probability:.588, last_action_results:{} };
const blocked = { ...initial, shot_clock:9, game_clock_remaining:123, ball_holder:1, last_action_results:{ pre_action_positions:initial.positions, shots:{0:{success:false,blocked:true,blocker_id:2,is_dunk:false,distance:1}}} };
const box = { player:{players:[{player_id:0,fga:1}],totals:{fga:1}}, ai:{players:[{player_id:2,blk:1}],totals:{blk:1}} };
createApp({ setup() {
 const history=ref([initial]);
 function play(){history.value=[initial];setTimeout(()=>{history.value=[initial,structuredClone(blocked)]},100)}
 return ()=>h('main',{style:'max-width:1000px;margin:auto;padding:16px'},[
  h('h1','Recorded block fixture'), h('button',{onClick:play},'Replay block'),
  h(GameBoard,{gameHistory:history.value,showGhostTrails:false,minimalChrome:true}),
  h(LiveBoxScore,{boxScore:box}),h(PlayByPlayPanel,{rows:buildPlayByPlay(history.value)}),
 ]);
}}).mount('#app');
</script></body></html>
