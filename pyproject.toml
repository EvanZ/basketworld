# pyproject.toml
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basketworld"
version = "0.1.0"
description = "A grid-based basketball simulation for reinforcement learning"
authors = [
    { name="Your Name", email="your@email.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "matplotlib",
    "pillow",
    "imageio-ffmpeg>=0.6.0",
    "tqdm",
    "jax>=0.8.0",
    "flax>=0.12.6",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.11.36",
    "pytest",
    "black",
    "isort",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "app/backend/tests",
    "app/training_backend/tests",
    "test_shot_movement_fix.py",
    "test_turnover_movement.py",
]
